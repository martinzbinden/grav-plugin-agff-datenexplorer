enabled: true
# Adresse der App (Ordner mit Einbettungsdatei, lib/ und nachgeladenen Dateien)
quelle: ''
einbettung: Datenexplorer_einbettung.json
# Optionales Vorschaubild (relativ zur Quelle), solange die App laedt
vorschaubild: ''
vorschaubild_alt: ''
# Abstand nach oben ab Tabletbreite (z.B. -3rem gegen grosses Theme-Polster)
abstand_oben: ''
# Leer = Texte aus languages.yaml in der Seitensprache (de, fr, it, en)
text_laden: ''
text_fenster: ''
text_fehler: ''
# Kurzlinks (siehe README): Pfad, Datenordner, erlaubte Ziele und Absender
kurz_pfad: '/g'
kurz_daten_dir: '../datenexplorer-daten'
kurz_hosts: ['graswachstum.ch']
kurz_origins: ['https://apps.graswachstum.ch']
kurz_max: 50000
kurz_limit: 120
